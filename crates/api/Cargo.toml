[package]
name = "apalis-board-api"
version = "1.0.0-rc.9"
edition = "2024"
description = "HTTP utilities for managing apalis task queues."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/apalis-dev/apalis-board"
homepage = "https://github.com/apalis-dev/apalis-board"
documentation = "https://docs.rs/apalis-board-api"
authors = ["Njuguna Mureithi <mureithinjuguna@gmail.com>"]
keywords = ["apalis", "api", "http"]
categories = ["asynchronous"]
include = ["src/**", "Cargo.toml", "LICENSE*", "README.md", "dist/**"]
publish = true


[dependencies]
apalis-core = { workspace = true, features = ["serde"] }
apalis-board-types.workspace = true
serde = { workspace = true, features = ["derive"] }
http = { version = "1.5.0", default-features = false, features = ["std"] }
futures.workspace = true
tokio = { version = "1", default-features = false, features = ["sync"] }
serde_json.workspace = true
tracing-core = { version = "0.1.36", optional = true }
tracing-subscriber = { workspace = true, features = [
    "json",
    "env-filter",
], optional = true }
include_dir = { version = "0.7.4", optional = true }
thiserror = { workspace = true }
actix-web = { workspace = true, optional = true }
actix-web-lab = { version = "0.29.4", optional = true }
axum = { version = "0.8", optional = true, features = [
    "json",
    "tokio",
    "query",
], default-features = false }

salvo = { workspace = true, features = ["sse", "affix-state"], optional = true }

[features]
default = ["sse"]
actix = ["dep:actix-web", "dep:actix-web-lab"]
salvo = ["dep:salvo"]
axum = ["dep:axum"]
sse = ["dep:tracing-core", "dep:tracing-subscriber"]
ui = ["dep:include_dir"]

[package.metadata.docs.rs]
# defines the configuration attribute `docsrs`
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[lints]
workspace = true
