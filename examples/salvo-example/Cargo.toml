[package]
name        = "salvo-example"
version     = "0.1.0"
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "apalis-board + Salvo example (mirrors axum-email-service)"

[[bin]]
name = "salvo-example"
path = "src/main.rs"

[dependencies]

apalis-core = { workspace = true, features = ["serde"] }
apalis = { workspace = true, features = ["limit", "retry", "tracing"] }
apalis-sqlite.workspace = true

apalis-board = { path = "../../", features = ["salvo", "ui", "events"] }

salvo = { version = "0.92", features = ["sse", "tower-compat"] }


tokio = { version = "1", features = ["full"] }


tracing             = "0.1"
tracing-subscriber  = { workspace = true , features = ["env-filter"] }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"

[lints]
workspace = true
